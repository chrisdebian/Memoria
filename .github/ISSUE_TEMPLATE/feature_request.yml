name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A rough description is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Other apps or workarounds, if any.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Memoria is fully offline and has no INTERNET permission.
      options:
        - label: This idea works without sending any data off the device
